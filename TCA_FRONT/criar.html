<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Aluno · ChessAcademy</title>
  <link rel="stylesheet" href="css/estilo1.css">
  <script src="js/componentes.js" defer></script>
</head>
<body>
  <app-nav></app-nav>

  <main class="login-wrapper">
    <app-header></app-header>

    <h1 class="titulo">Cadastrar aluno</h1>

    <div class="card">
      <form id="form-aluno">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" required autofocus>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="rating_atual">Rating</label>
          </div>
          <input type="number" id="rating_atual" name="rating_atual" step="1" required>
        </div>

        <button type="submit" class="btn-primary">Cadastrar</button>
      </form>
    </div>

    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>

  <app-footer></app-footer>

  <script>
    const SUPABASE_URL = "https://jqtdddcxplsaogfvdrpe.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8xSfY9zg9z8ETzdlp1buQQ_xfVlKk2D";

    const form = document.getElementById("form-aluno");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      mensagem.textContent = "Salvando...";

      const aluno = {
        nome: form.elements.nome.value.trim(),
        rating_atual: Number(form.elements.rating_atual.value)
      };

      try {
        const resposta = await fetch(`${SUPABASE_URL}/rest/v1/alunos`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify(aluno)
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
          throw new Error(resultado.message || "Não foi possível inserir o aluno.");
        }

        mensagem.textContent = `Aluno cadastrado. ID: ${resultado[0].id_aluno}`;
        form.reset();
      } catch (erro) {
        mensagem.textContent = `Erro: ${erro.message}`;
      }
    });
  </script>
</body>
</html>
