<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excluir Aluno · ChessAcademy</title>
  <link rel="stylesheet" href="css/estilo1.css">
  <script src="js/componentes.js" defer></script>
</head>
<body>
  <app-nav></app-nav>

  <main class="login-wrapper">
    <app-header></app-header>

    <h1 class="titulo">Excluir aluno</h1>

    <div class="card">
      <form id="form-deletar">
        <div class="form-group">
          <label for="id_aluno">ID do aluno</label>
          <input id="id_aluno" name="id_aluno" type="number" min="1" step="1" required autofocus>
        </div>

        <button id="botao" type="submit" class="btn-primary btn-danger">Excluir registro</button>
      </form>
    </div>

    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>

  <app-footer></app-footer>

  <script>
    const SUPABASE_URL = "https://jqtdddcxplsaogfvdrpe.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8xSfY9zg9z8ETzdlp1buQQ_xfVlKk2D";

    const form = document.getElementById("form-deletar");
    const botao = document.getElementById("botao");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const idAluno = Number(form.elements.id_aluno.value);
      if (!Number.isInteger(idAluno) || idAluno <= 0) {
        mensagem.textContent = "Informe um ID válido.";
        return;
      }

      if (!confirm(`Deseja excluir o aluno com ID ${idAluno}?`)) {
        mensagem.textContent = "Exclusão cancelada.";
        return;
      }

      botao.disabled = true;
      mensagem.textContent = "Excluindo...";

      try {
        const url = `${SUPABASE_URL}/rest/v1/alunos?id_aluno=eq.${encodeURIComponent(idAluno)}`;

        const resposta = await fetch(url, {
          method: "DELETE",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            "Prefer": "return=representation"
          }
        });

        const texto = await resposta.text();

        if (!resposta.ok) {
          throw new Error(texto || `Erro HTTP ${resposta.status}`);
        }

        const removidos = texto ? JSON.parse(texto) : [];

        if (!removidos.length) {
          mensagem.textContent = "Nenhum registro foi excluído. Confira se esse ID existe.";
          return;
        }

        mensagem.textContent = `Aluno "${removidos[0].nome}" (ID: ${removidos[0].id_aluno}) excluído.`;
        form.reset();
      } catch (erro) {
        mensagem.textContent = `Erro ao excluir: ${erro.message}`;
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
